[package]
name = "getchat"
version = "1.4.0"
description = "A local-first AI exploration workbench with branching conversations"
authors = ["QiFans"]
edition = "2021"

[lib]
name = "getchat_lib"
crate-type = ["cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
async-trait = "0.1"
regex = "1"
once_cell = "1"
encoding_rs = "0.8"
scopeguard = "1"
scraper = "0.27.0"
urlencoding = "2.1.3"
serde_yaml = "0.9.34"
rmcp = { version = "1.7", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Console"] }

# Golden-harness tests (agent/eval) use tokio's paused clock for retry backoff.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# Patch rmcp v1.7.0 to tolerate MCP servers that return responses without
# Content-Type header (e.g. ZhiPu zread).  Remove this patch when upstream
# releases a fix.  Ref: modelcontextprotocol/rust-sdk#237, #688
[patch.crates-io]
rmcp = { git = "https://github.com/NianLog/rust-sdk", rev = "d3509c4deffb031c7a61aec7bc34bbecd9dcdc47" }
